# Pakiety dbt - dbt deps instaluje je do dbt_packages/ i zapisuje dokładne wersje w package-lock.yml.
# dbt_utils: ogólne makra (m.in. get_column_values), dbt_expectations: dodatkowe testy.
# Bez dbt-labs/codegen: projekt ma własną kopię generate_base_model, która i tak wygrywa z makrem
# pakietu. dbt nie dzieli zależności na dev/prod, więc zasada: każdy pakiet tutaj ma konsumenta w kodzie.
packages:
  - package: dbt-labs/dbt_utils
    version: 1.4.1

  # calogica/dbt_expectations jest zarchiwizowany - metaplane/dbt_expectations to aktywny fork
  - package: metaplane/dbt_expectations
    version: 0.10.10
