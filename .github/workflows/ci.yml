# CI na pull request. Trzy joby:
#   static   - krok 0: sqlfluff + dbt parse, BEZ poświadczeń (działa też dla PR z forka)
#   slim-ci  - dbt build tylko zmienionych modeli i ich potomków, w datasecie ci_pr_<nr>
#   cleanup  - po zamknięciu PR kasuje dataset ci_pr_<nr>
# Opis mechanizmu i konfiguracji GCP/GitHub: docs/ci-cd.md
name: ci

on:
  pull_request:
    # closed = merge albo zamknięcie bez merge'a; uruchamia tylko cleanup.
    types: [opened, synchronize, reopened, closed]

# Nowy push do PR anuluje poprzedni, jeszcze trwający przebieg - płacimy za ostatnią wersję kodu.
concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# Domyślnie minimum. id-token: write dostają tylko joby, które logują się do GCP.
permissions:
  contents: read

env:
  DBT_PROFILES_DIR: ci
  # Biblioteki Google ostrzegają o końcu wsparcia Pythona 3.11 - szum w logach, nie błąd.
  PYTHONWARNINGS: ignore::FutureWarning

jobs:
  static:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # pełna historia - potrzebna do git diff z gałęzią bazową

      - uses: astral-sh/setup-uv@v10

      # --locked: pada, jeśli uv.lock nie zgadza się z pyproject.toml (zamiast go po cichu zmienić).
      - run: uv sync --locked

      - name: sqlfluff (tylko pliki zmienione w PR)
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          # Lint całego repo zgłasza dziś ~30 naruszeń w starych plikach. Bramka czerwona od
          # pierwszego dnia zostałaby zignorowana, więc wymagamy czystości od plików dotykanych w PR.
          files=$(git diff --name-only --diff-filter=ACMR "origin/${BASE_REF}...HEAD" -- '*.sql')
          if [ -z "$files" ]; then
            echo "Brak zmienionych plików SQL."
            exit 0
          fi
          uvx sqlfluff==4.4.0 lint $files

      - name: dbt deps + parse
        env:
          # parse nie łączy się z BigQuery, ale profil wymaga wartości zmiennych.
          BIGQUERY_PROJECT: parse-only
          DBT_CI_DATASET: parse_only
        run: |
          uv run dbt deps
          uv run dbt parse

  slim-ci:
    needs: static
    # PR z forka nie dostaje tokenu OIDC ani sekretów - pomijamy build zamiast pozwolić mu paść.
    # vars.GCP_WIF_PROVIDER: dopóki GCP nie jest skonfigurowane, job się pomija zamiast padać.
    if: >-
      vars.GCP_WIF_PROVIDER != '' &&
      github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # pozwala pobrać token OIDC GitHuba do wymiany w WIF
    env:
      BIGQUERY_PROJECT: ${{ vars.GCP_PROJECT_CI }}
      DBT_CI_DATASET: ci_pr_${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10

      - run: uv sync --locked

      # Token OIDC -> WIF -> krótkotrwałe poświadczenia konta sa-dbt-ci (ADC dla dbt i gcloud).
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SA_CI }}

      - uses: google-github-actions/setup-gcloud@v3

      - name: Dataset PR z wygasaniem tabel
        # Siatka bezpieczeństwa na wypadek, gdyby cleanup nie zadziałał: tabele znikną po 24h same.
        # --force: brak błędu, gdy dataset już istnieje (kolejny push do tego samego PR).
        run: >-
          bq --location=US mk --force --dataset
          --default_table_expiration 86400
          "${BIGQUERY_PROJECT}:${DBT_CI_DATASET}"

      - name: Manifest prod (stan do porównania)
        id: state
        run: |
          mkdir -p prod-state
          if gcloud storage cp "gs://${{ vars.GCS_MANIFEST_BUCKET }}/prod/manifest.json" prod-state/; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            # Pierwszy przebieg, zanim CD opublikował manifest: budujemy wszystko.
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - run: uv run dbt deps

      - name: dbt build (Slim CI)
        run: |
          # Snapshot wykluczony: target_schema='snapshots_project' nie dostaje prefiksu targetu,
          # więc CI pisałby do tej samej tabeli historii co dev w tym projekcie GCP.
          if [ "${{ steps.state.outputs.found }}" = "true" ]; then
            # state:modified+  - zmienione węzły i wszystko, co od nich zależy
            # --defer --state  - ref() do NIEzmienionego modelu wskazuje tabelę prod, nie buduje jej
            uv run dbt build --select state:modified+ --defer --state prod-state \
              --exclude resource_type:snapshot
          else
            uv run dbt build --exclude resource_type:snapshot
          fi

      - name: Testy na warn blokują PR
        run: uv run python ci/check_test_warnings.py target/run_results.json

      - name: Artefakty dbt
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dbt-ci-${{ github.event.pull_request.number }}
          path: |
            target/run_results.json
            target/manifest.json
            logs/dbt.log
          if-no-files-found: ignore

  cleanup:
    if: >-
      vars.GCP_WIF_PROVIDER != '' &&
      github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SA_CI }}

      - uses: google-github-actions/setup-gcloud@v3

      - name: Usuń dataset PR
        env:
          DATASET: ${{ vars.GCP_PROJECT_CI }}:ci_pr_${{ github.event.pull_request.number }}
        run: |
          # -r: razem z tabelami, -f: bez pytania. Brak datasetu (PR bez builda) to nie błąd.
          if bq show --dataset "$DATASET" > /dev/null 2>&1; then
            bq rm -r -f --dataset "$DATASET"
          else
            echo "Dataset $DATASET nie istnieje - nic do sprzątania."
          fi
