# Dokumentacja + testy + governance dla dim_orders (jedyny model w marts/).
# Governance w dbt to głównie metadane: group + access pilnują tylko ref() między modelami. Kto czyta
# tabelę - IAM na datasecie BigQuery (albo grants); kto ją buduje - IAM konta z profiles.yml; kto
# zmienia kod - git (.github/CODEOWNERS + branch protection). group powtórzony tu mimo +group na
# folderze marts/ w dbt_project.yml - dla czytelności.
version: 2

groups:
  - name: sales
    owner:
      # Deklaracja, nie bramka: owner to tekst w dbt docs - dbt go nie waliduje i nie wiąże ani
      # z tym, kto odpala dbt run, ani z tym, kto może zmienić kod. Realną akceptację zmian daje
      # dopiero .github/CODEOWNERS + branch protection, dlatego wskazuje tę samą osobę (zamiast
      # placeholdera z materiału źródłowego, który dbt docs pokazywał jako kontakt).
      name: Piotr Maćkówka

models:
  - name: dim_orders
    description: "Tabela zawierająca informacje na poziomie zamówienia"

    # Grupa musi być zdefiniowana w bloku groups: (tu, na górze pliku); osobny groups.yml to tylko konwencja.
    config:
      group: sales

      # Ustawienie poziomu dostępu do modelu:
      # - private: tylko inne modele z tej samej grupy (czyli "sales") mogą używać tego modelu przez ref()
      # - protected: modele z tej samej grupy lub projektu mogą go używać (domyślny poziom)
      # - public: każdy model (nawet z innego projektu dbt) może użyć ref()
      #
      # public, bo mart to punkt końcowy dla BI i innych projektów dbt (dbt Mesh); staging
      # i intermediate zostają protected, żeby nikt nie budował logiki na tabelach pośrednich.
      # Deklaracja, nie bramka: public nie daje nikomu dostępu do danych (to IAM/grants) ani sam
      # nie pilnuje stabilności schematu - to robi dopiero kontrakt niżej.
      access: public

      # Kontrakt - realna bramka: przy buildzie dbt porównuje kolumny i typy z tego pliku z wynikiem
      # SELECT-a i PRZERYWA build przy rozjeździe. Tu ważne, bo kolumny total_sold_* wynikają
      # z DANYCH (pętla po get_column_values) - nowy dział w źródle to nowa kolumna publicznego martu
      # bez zmiany w kodzie. Kontrakt zamienia to w czerwony build. Uwaga: dbt parse tego nie
      # sprawdzi - kontrakt działa dopiero przy dbt build na żywej bazie.
      # Przy okazji tabela powstaje jako "select <kolumny z YAML> from (...)", więc kolejność kolumn
      # przestaje zależeć od liczności działów. Koszt: data_type przy każdej kolumnie.
      contract:
        enforced: true

    # Kolejność kolumn poniżej = kolejność kolumn w tabeli (patrz kontrakt wyżej) - trzymana
    # zgodnie z kolejnością w dim_orders.sql.
    columns:

    # Kolumny ze stg_ecommerce__orders - bez ponownych testów (poza kluczem), bo testuje je staging;
    # jeden test w jednym miejscu zamiast kopii w każdym modelu. To zaufanie działa tylko dla testów
    # na error: test na warn niczego nie zatrzymuje i dim_orders zbuduje się mimo złych danych.
    # Stąd error na kluczach, na których ten model stoi (user_id, created_at, order_id).
      - name: order_id
        data_type: INTEGER
        tests:
          # Generic test z tests/generic/test_primary_key.sql - dbt sam przekazuje model i kolumnę.
          - primary_key:
              config:
                severity: error
          - relationships:
              arguments:
                to: ref('stg_ecommerce__orders')
                field: order_id
              config:
                severity: error

      - name: order_created_at
        data_type: TIMESTAMP
        description: "When the order was created"

      - name: order_was_created_on_weekend
        data_type: BOOLEAN
        description: "Whether the order was created on Saturday or Sunday"
        tests:
          # Nowa logika policzona w TYM modelu (makro is_weekend), nie przepisana ze staging -
          # więc test tutaj, zgodnie z podziałem opisanym niżej przy agregatach.
          - not_null

      - name: order_shipped_at
        data_type: TIMESTAMP
        description: "When the order was shipped"

      - name: order_delivered_at
        data_type: TIMESTAMP
        description: "When the order was delivered"

      - name: order_returned_at
        data_type: TIMESTAMP
        description: "When the order was returned"

      - name: order_status
        data_type: STRING
        description: "{{ doc('status') }}"

      - name: num_items_ordered
        data_type: INTEGER
        description: "Number of items in the order"

    # Agregaty liczone w TYM modelu (SUM, podział po department) - testowane tutaj, bo to nowa
    # logika, której nie sprawdza żaden wcześniejszy model.
      - name: total_sale_price
        data_type: FLOAT64
        description: "Sum of item_sale_price for the whole order"
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0

      - name: total_product_cost
        data_type: FLOAT64
        description: "Sum of product_cost for the whole order"
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0

      - name: total_profit
        data_type: FLOAT64
        description: "Sum of (item_sale_price - product_cost) for the whole order"
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0

      - name: total_discount
        data_type: FLOAT64
        description: "Sum of (product_retail_price - item_sale_price) for the whole order"
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0

      - name: total_sold_menswear
        data_type: FLOAT64
        description: "Sum of item_sale_price for items in the Menswear department for this order"
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0

      - name: total_sold_womenswear
        data_type: FLOAT64
        description: "Sum of item_sale_price for items in the Womenswear department for this order"
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0

    # Column from int_ecommerce__first_order_created
      - name: days_since_first_order
        data_type: INTEGER
        description: "How many days there were between a user's first order and this one"
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
