# Dokumentacja + testy dla stg_ecommerce__orders. order_id używa własnego generic testu
# primary_key (tests/generic/test_primary_key.sql = not_null + unique w jednym). Testy z where:
# w config (returned_at, delivered_at, shipped_at) sprawdzają wartość tylko na podzbiorze wierszy,
# np. returned_at nie może być NULL TYLKO gdy status = 'Returned'.
version: 2

models:
  - name: stg_ecommerce__orders
    columns:
      - name: order_id
        tests:
          - primary_key:
              config:
                severity: error

      # error, nie domyślny warn: user_id i created_at to klucze dalszej logiki - user_id joinuje
      # int_ecommerce__first_order_created do dim_orders, created_at liczy MIN() pierwszego
      # zamówienia i days_since_first_order. warn nie blokuje dbt build, więc dim_orders
      # zbudowałby się dalej na NULL-ach w kluczu - mart "ufałby testom w staging", które niczego
      # nie zatrzymują. Reguła: error dla kolumn, na których stoją joiny/agregacje, warn dla
      # reguł biznesowych (statusy, kolejność timestampów niżej).
      - name: user_id
        tests:
          - not_null:
              config:
                severity: error

      - name: created_at
        description: "When the order was created"
        tests:
          - not_null:
              config:
                severity: error

      - name: returned_at
        description: "When the order was returned"
        tests:
          - not_null:
              config:
                where: "status = 'Returned'"
          - dbt_utils.expression_is_true:
              arguments:
                expression: ">= delivered_at"
              config:
                where: "delivered_at IS NOT NULL AND returned_at IS NOT NULL"

      - name: delivered_at
        description: "When the order was delivered"
        tests:
          - not_null:
              config:
                where: "returned_at IS NOT NULL OR status = 'Complete'"
          - dbt_utils.expression_is_true:
              arguments:
                expression: ">= shipped_at"
              config:
                where: "delivered_at IS NOT NULL AND shipped_at IS NOT NULL"

      - name: shipped_at
        description: "When the order was shipped"
        tests:
          - not_null:
              config:
                where: "delivered_at IS NOT NULL OR status = 'Shipped'"
          - dbt_utils.expression_is_true:
              arguments:
                expression: ">= created_at"
              config:
                where: "shipped_at IS NOT NULL"

      - name: status
        description: "{{ doc('status') }}"
        # Treść opisu żyje w osobnym pliku: models/documents/doc_ecommerce__status.md. Po co: ten
        # sam blok doc() można wkleić w dowolnym innym miejscu (patrz models/marts/dim_orders.yml,
        # kolumna order_status - identyczne odwołanie), więc opis statusów zamówienia edytuje się
        # raz, w jednym miejscu, zamiast kopiować ten sam tekst do wielu plików .yml.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - Processing
                  - Cancelled
                  - Shipped
                  - Complete
                  - Returned
              config:
                # Nadpisanie domyślnej, automatycznie generowanej nazwy testu (byłaby długa i mało
                # czytelna, np. accepted_values_stg_ecommerce__orders_status__Processing__...) -
                # własna nazwa trafia do logu przy błędzie, więc od razu wiadomo, co konkretnie
                # nie przeszło, bez rozszyfrowywania wygenerowanej nazwy.
                name: unexpected_order_status

      - name: num_items_ordered
        description: "Number of items in the order"
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
