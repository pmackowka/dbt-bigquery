# Dokumentacja + testy dla stg_ecommerce__orders. order_id: własny test primary_key (not_null +
# unique). where: w config testuje tylko podzbiór, np. returned_at NOT NULL tylko dla 'Returned'.
# Testy bez jawnego severity są na warn (default projektu) - czyli tylko wpis w logu, nic nie blokują.
version: 2

models:
  - name: stg_ecommerce__orders
    columns:
      - name: order_id
        tests:
          - primary_key:
              config:
                severity: error

      # error, nie warn: user_id joinuje datę pierwszego zamówienia do dim_orders, created_at liczy
      # MIN() i days_since_first_order. Na warn dim_orders zbudowałby się na NULL-ach w kluczu.
      # Reguła: error dla kolumn pod joinami/agregacjami, warn dla reguł biznesowych niżej.
      - name: user_id
        tests:
          - not_null:
              config:
                severity: error

      - name: created_at
        description: "When the order was created"
        tests:
          - not_null:
              config:
                severity: error

      - name: returned_at
        description: "When the order was returned"
        tests:
          - not_null:
              config:
                where: "status = 'Returned'"
          - dbt_utils.expression_is_true:
              arguments:
                expression: ">= delivered_at"
              config:
                where: "delivered_at IS NOT NULL AND returned_at IS NOT NULL"

      - name: delivered_at
        description: "When the order was delivered"
        tests:
          - not_null:
              config:
                where: "returned_at IS NOT NULL OR status = 'Complete'"
          - dbt_utils.expression_is_true:
              arguments:
                expression: ">= shipped_at"
              config:
                where: "delivered_at IS NOT NULL AND shipped_at IS NOT NULL"

      - name: shipped_at
        description: "When the order was shipped"
        tests:
          - not_null:
              config:
                where: "delivered_at IS NOT NULL OR status = 'Shipped'"
          - dbt_utils.expression_is_true:
              arguments:
                expression: ">= created_at"
              config:
                where: "shipped_at IS NOT NULL"

      - name: status
        description: "{{ doc('status') }}"
        # Opis w models/documents/doc_ecommerce__status.md, używany też w dim_orders.yml - edycja
        # w jednym miejscu. DRY tylko w repo: persist_docs kopiuje tekst do metadanych KAŻDEJ tabeli,
        # więc po zmianie .md oba modele trzeba przebudować, żeby opisy w BigQuery się zgadzały.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - Processing
                  - Cancelled
                  - Shipped
                  - Complete
                  - Returned
              config:
                # Własna nazwa zamiast generowanej (accepted_values_stg_ecommerce__orders_status__...)
                # - w logu błędu od razu widać, co nie przeszło.
                name: unexpected_order_status

      - name: num_items_ordered
        description: "Number of items in the order"
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
