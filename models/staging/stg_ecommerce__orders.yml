# Dokumentacja + testy dla stg_ecommerce__orders. order_id używa własnego generic testu
# primary_key (tests/generic/test_primary_key.sql = not_null + unique w jednym). Testy z where:
# w config (returned_at, delivered_at, shipped_at) sprawdzają wartość tylko na podzbiorze wierszy,
# np. returned_at nie może być NULL TYLKO gdy status = 'Returned'.
version: 2

models:
  - name: stg_ecommerce__orders
    columns:
      - name: order_id
        tests:
          - primary_key:
              config:
                severity: error

      - name: user_id
        tests:
          - not_null

      - name: created_at
        description: "When the order was created"
        tests:
          - not_null

      - name: returned_at
        description: "When the order was returned"
        tests:
          - not_null:
              config:
                where: "status = 'Returned'"
          - dbt_utils.expression_is_true:
              arguments:
                expression: ">= delivered_at"
              config:
                where: "delivered_at IS NOT NULL AND returned_at IS NOT NULL"

      - name: delivered_at
        description: "When the order was delivered"
        tests:
          - not_null:
              config:
                where: "returned_at IS NOT NULL OR status = 'Complete'"
          - dbt_utils.expression_is_true:
              arguments:
                expression: ">= shipped_at"
              config:
                where: "delivered_at IS NOT NULL AND shipped_at IS NOT NULL"

      - name: shipped_at
        description: "When the order was shipped"
        tests:
          - not_null:
              config:
                where: "delivered_at IS NOT NULL OR status = 'Shipped'"
          - dbt_utils.expression_is_true:
              arguments:
                expression: ">= created_at"
              config:
                where: "shipped_at IS NOT NULL"

      - name: status
        description: "{{ doc('status') }}"
        # Look in documents/ecommerce/doc_ecommerce__status.md for this definition
        # We can reuse this definition in any column
        tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - Processing
                  - Cancelled
                  - Shipped
                  - Complete
                  - Returned
              config:
                name: unexpected_order_status # We can name our tests to make it easier to give more meaningful errors

      - name: num_items_ordered
        description: "Number of items in the order"
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
