# Surowe tabele źródłowe (bigquery-public-data.thelook_ecommerce) dla modeli stg_ecommerce__*.
# source() wskazuje tabelę spoza projektu dbt, w odróżnieniu od ref().
version: 2

sources:
  - name: thelook_ecommerce
    database: bigquery-public-data
    tables:
      - name: events
        # Freshness tylko tu, celowo: events.created_at przybliża moment dopływu danych. W orders
        # to czas zdarzenia BIZNESOWEGO - dzień bez zamówień dałby fałszywy alarm; w wymiarach brak
        # zmian przez dni jest normą.
        # Deklaracja, nie bramka: dbt build freshness NIE sprawdza. error_after coś zatrzyma dopiero,
        # gdy orkiestracja (Airflow/CI) odpali dbt source freshness jako osobny krok przed buildem.
        config:
          freshness:
            warn_after: {count: 12, period: hour}
            error_after: {count: 24, period: hour}
          loaded_at_field: created_at
      - name: inventory_items
      - name: order_items
      - name: orders
      - name: products
      - name: users
      - name: distribution_centers # Nowa tabela na której jest robiony snapshots



