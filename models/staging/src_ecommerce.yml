# Definicja source() - surowych tabel źródłowych (bigquery-public-data.thelook_ecommerce), na
# których bazują wszystkie modele stg_ecommerce__*. source() (w odróżnieniu od ref()) odwołuje się
# do tabeli spoza projektu dbt; freshness/loaded_at_field w config pozwalają sprawdzić przez
# `dbt source freshness`, czy dane w events nie są przestarzałe.
version: 2

sources:
  - name: thelook_ecommerce
    database: bigquery-public-data
    tables:
      - name: events
        # Freshness tylko tutaj, celowo nie na pozostałych tabelach - nie "dopisywać wszędzie".
        # events.created_at to jedyna kolumna, która realnie przybliża moment dopływu danych
        # (strumień zdarzeń). W orders/order_items created_at to czas zdarzenia BIZNESOWEGO, nie
        # load time - dzień bez zamówień dałby fałszywy alarm "dane nieświeże", choć pipeline działa.
        # Przy tabelach wymiarów (products, distribution_centers) brak zmian przez dni to stan
        # normalny, nie awaria. Uwaga: dbt build nie odpala freshness - to osobna komenda
        # (dbt source freshness), którą orkiestracja musi wywołać jako bramkę PRZED buildem.
        config:
          freshness:
            warn_after: {count: 12, period: hour}
            error_after: {count: 24, period: hour}
          loaded_at_field: created_at
      - name: inventory_items
      - name: order_items
      - name: orders
      - name: products
      - name: users
      - name: distribution_centers # Nowa tabela na której jest robiony snapshots



