# Dokumentacja + testy + kontrakt dla stg_ecommerce__order_items. Kontrakt sprawdza STRUKTURĘ
# (kolumny, typy, constraints) przy budowie - rozjazd = build pada od razu. Testy sprawdzają DANE
# po zbudowaniu. Dwa uzupełniające się mechanizmy.
# Pochodzenie testów - tag w komentarzu przy każdym teście:
#   [natywny dbt]      wbudowany w dbt-core (not_null, unique, accepted_values, relationships)
#   [dbt_utils]        pakiet dbt-labs/dbt_utils - wywołanie z prefiksem dbt_utils.
#   [dbt_expectations] pakiet metaplane/dbt_expectations - wywołanie z prefiksem dbt_expectations.
#   [własny]           generic test z tests/generic/ (primary_key) - bez prefiksu, jak natywny
version: 2

models:
  - name: stg_ecommerce__order_items
    description: "Line items from orders"
    config:
      contract:
        enforced: true
    columns:
      - name: order_item_id
        # Test dbt - uruchamia się PO zbudowaniu modelu
        tests:
          - not_null:  # [natywny dbt]
              config:
                severity: error
          - unique:  # [natywny dbt]
              config:
                severity: error
        # Kontrakt - wymuszany PRZED zbudowaniem modelu
        data_type: INTEGER
        constraints:
          # not_null celowo DWA razy (test wyżej + constraint tutaj) - pokazuje dwa momenty
          # kontroli: constraint zatrzyma budowę tabeli, test złapałby to samo dopiero po niej.
          - type: not_null

      - name: order_id
        data_type: INTEGER
        tests:
          - not_null  # [natywny dbt]
          - relationships:  # [natywny dbt]
              arguments:
                to: ref('stg_ecommerce__orders')
                field: order_id

      - name: user_id
        data_type: INTEGER
        tests:
          - not_null  # [natywny dbt]

      - name: product_id
        data_type: INTEGER
        tests:
          - not_null  # [natywny dbt]
          - relationships:  # [natywny dbt]
              arguments:
                to: ref('stg_ecommerce__products')
                field: product_id

      - name: item_sale_price
        data_type: FLOAT64
        description: "How much the item sold for"
        tests:
          - not_null  # [natywny dbt]
          - dbt_expectations.expect_column_values_to_be_between:  # [dbt_expectations]
              arguments:
                min_value: 0