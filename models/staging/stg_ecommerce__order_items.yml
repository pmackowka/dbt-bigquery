# Dokumentacja + testy + kontrakt dla stg_ecommerce__order_items. Kontrakt (contract: enforced)
# wymusza strukturę (data_type, constraints) PRZED zbudowaniem modelu - jeśli SQL nie zgadza się
# z deklaracją (brakująca kolumna, zły typ), build pada od razu. Testy w tests: (not_null, unique,
# relationships) sprawdzają dane PO zbudowaniu - to dwa różne, uzupełniające się mechanizmy.
version: 2

models:
  - name: stg_ecommerce__order_items
    description: "Line items from orders"
    config:
      contract:
        enforced: true
    columns:
      - name: order_item_id
        # Test dbt - uruchamia się PO zbudowaniu modelu
        tests:
          - not_null:
              config:
                severity: error
          - unique:
              config:
                severity: error
        # Kontrakt - wymuszany PRZED zbudowaniem modelu
        data_type: INTEGER
        constraints:
          # Ten sam warunek (not_null) jest tu zapisany DWA razy - w tests: wyżej i w
          # constraints: tutaj. Można by usunąć test not_null jako duplikat, ale zostawiony
          # celowo: pokazuje, że to dwa różne mechanizmy działające w różnych momentach (kontrakt
          # zablokuje build z błędem PRZED utworzeniem tabeli, test złapałby to samo dopiero PO -
          # w praktyce kontrakt i tak zdąży pierwszy, test tu jest głównie demonstracyjny).
          - type: not_null

      - name: order_id
        data_type: INTEGER
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_ecommerce__orders')
                field: order_id

      - name: user_id
        data_type: INTEGER
        tests:
          - not_null

      - name: product_id
        data_type: INTEGER
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_ecommerce__products')
                field: product_id

      - name: item_sale_price
        data_type: FLOAT64
        description: "How much the item sold for"
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0