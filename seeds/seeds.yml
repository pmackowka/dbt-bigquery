# Dokumentacja + testy + typy kolumn dla seeda seed_distribution_centers_new.csv. Seed to plik CSV
# ładowany do bazy WYŁĄCZNIE przez `dbt seed` (dbt run go pomija), ale testowany normalnie przez
# `dbt test` jak każdy inny model. column_types w config wymusza typy w BigQuery zamiast polegać
# na automatycznym wykryciu z zawartości CSV.
version: 2

seeds:
  - name: seed_distribution_centers_new
    description: "An example of using a CSV file to load data into your warehouse"
    tests:
      - dbt_expectations.expect_table_row_count_to_equal:
          arguments:
            value: 2

    # Column names, descriptions, and tests can all be done as normal
    columns:
      - name: id
        tests:
          - not_null
          - unique
      - name: name
        description: "Distribution center name"
      - name: latitude
      - name: longitude

    # If you want to enforce datatypes, you can do so here
    # Otherwise, BigQuery will do it for you!
    config:
      column_types:
        id: INTEGER
        name: STRING
        latitude: FLOAT
        longitude: FLOAT