# Dokumentacja, testy i typy dla seed_distribution_centers_new.csv. Seed ładuje dbt seed albo
# dbt build (dbt run go pomija), testuje się go jak zwykły model.
version: 2

seeds:
  - name: seed_distribution_centers_new
    # Opis mówi, CZYM są dane: trzy tabele mają prawie tę samą nazwę (źródło, snapshot, ten seed),
    # więc bez tego seed wygląda jak duplikat źródła - a to centra, których w źródle NIE MA.
    # Seed nie ma konsumenta (brak ref()) - świadomie izolowany przykład; w realnym projekcie
    # sens nadałby mu dopiero UNION ALL ze źródłem.
    description: >
      Dwa nowe centra dystrybucji (id 11-12: Miami FL, Denver CO), nieobecne w publicznym źródle
      thelook_ecommerce.distribution_centers. Przykład danych ładowanych do hurtowni ręcznie z pliku
      CSV, dopóki nie zaczną płynąć z systemu źródłowego - nie kopia ani nadpisanie źródła.
    # Test na całym seedzie: dokładnie 2 wiersze - łapie przypadkowe nadpisanie CSV przy edycji.
    tests:
      - dbt_expectations.expect_table_row_count_to_equal:
          arguments:
            value: 2

    # Kolumny seeda dokumentuje i testuje się dokładnie tak samo jak kolumny zwykłego modelu.
    columns:
      - name: id
        tests:
          - not_null
          - unique
      - name: name
        description: "Distribution center name"
      - name: latitude
      - name: longitude

    # Typy jawnie, bo auto-detekcja z CSV zgaduje z zawartości: kolumna z samymi liczbami całkowitymi
    # stanie się INTEGER i pęknie przy pierwszej wartości z przecinkiem dopisanej później.
    config:
      column_types:
        id: INTEGER
        name: STRING
        latitude: FLOAT
        longitude: FLOAT