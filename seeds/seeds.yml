# Dokumentacja + testy + typy kolumn dla seeda seed_distribution_centers_new.csv. Seed to plik CSV
# ładowany do bazy WYŁĄCZNIE przez `dbt seed` (dbt run go pomija), ale testowany normalnie przez
# `dbt test` jak każdy inny model. column_types w config wymusza typy w BigQuery zamiast polegać
# na automatycznym wykryciu z zawartości CSV.
version: 2

seeds:
  - name: seed_distribution_centers_new
    description: "Przykład ładowania danych do hurtowni przez plik CSV zamiast source() z bazy"
    # Test na poziomie całego seeda (nie kolumny) - pilnuje, żeby plik CSV faktycznie miał 2
    # wiersze. Po co: seed to plik trzymany w repo, ktoś mógłby go przypadkiem nadpisać albo
    # dodać/usunąć wiersz przy edycji - ten test złapałby taką pomyłkę przy najbliższym dbt test.
    tests:
      - dbt_expectations.expect_table_row_count_to_equal:
          arguments:
            value: 2

    # Kolumny seeda dokumentuje i testuje się dokładnie tak samo jak kolumny zwykłego modelu.
    columns:
      - name: id
        tests:
          - not_null
          - unique
      - name: name
        description: "Distribution center name"
      - name: latitude
      - name: longitude

    # Wymuszenie typów kolumn jest opcjonalne - bez tego BigQuery i tak wykryje typy sam,
    # zgadując je z zawartości CSV. Robimy to jawnie, bo auto-detekcja bywa zawodna przy małych
    # plikach (np. kolumna z samymi liczbami całkowitymi w pierwszych wierszach może zostać
    # rozpoznana jako INTEGER, mimo że dalej w pliku pojawia się wartość z przecinkiem) - jawny
    # typ eliminuje to ryzyko raz na zawsze, niezależnie od tego, jak zmieni się zawartość pliku.
    config:
      column_types:
        id: INTEGER
        name: STRING
        latitude: FLOAT
        longitude: FLOAT