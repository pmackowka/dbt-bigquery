# Profil dbt dla GitHub Actions (DBT_PROFILES_DIR=ci). Lokalnie używasz profiles.yml z
# profiles.yml.example - tamten loguje kluczem JSON konta serwisowego, ten nie ma żadnego klucza.
#
# method: oauth = Application Default Credentials. W Actions ADC ustawia krok
# google-github-actions/auth: wymienia token OIDC GitHuba na krótkotrwały token Google przez
# Workload Identity Federation (WIF). Żaden sekret nie leży w repo ani w ustawieniach GitHuba.
#
# Identyfikatory projektów przychodzą ze zmiennych Actions (vars.*), nie z tego pliku - repo jest
# publiczne, a ID projektu GCP to informacja, której nie publikujemy.
ecommerce_analytics: # musi pasować do `profile:` w dbt_project.yml
  target: ci
  outputs:
    ci:
      type: bigquery
      method: oauth
      project: "{{ env_var('BIGQUERY_PROJECT') }}"
      # ci_pr_<numer PR> - każdy PR buduje się w osobnym datasecie, więc dwa otwarte PR-y nie
      # nadpisują sobie tabel. Dataset kasuje job cleanup po zamknięciu PR.
      dataset: "{{ env_var('DBT_CI_DATASET') }}"
      location: US  # tam, gdzie bigquery-public-data.thelook_ecommerce
      priority: interactive
      threads: 8
      job_execution_timeout_seconds: 300
      job_retries: 1
      # Twardy limit na JEDNO zapytanie: job, który przeskanowałby więcej, pada przed startem
      # i nic nie kosztuje. Chroni przed pomyłką w PR (np. zgubiony filtr partycji).
      maximum_bytes_billed: 10737418240  # 10 GiB

    # Nazwa musi zostać "prod": warunki w dbt_project.yml (hours_to_expiration) patrzą na target.name.
    prod:
      type: bigquery
      method: oauth
      project: "{{ env_var('BIGQUERY_PROD_PROJECT') }}"
      dataset: dbt_prod_project
      location: US
      priority: interactive
      threads: 8
      job_execution_timeout_seconds: 300
      job_retries: 1
      maximum_bytes_billed: 107374182400  # 100 GiB
