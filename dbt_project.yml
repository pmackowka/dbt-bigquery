# Główny plik konfiguracyjny projektu dbt: nazwa, profil (musi się zgadzać z kluczem najwyższego
# poziomu w profiles.yml), ścieżki folderów, domyślna materializacja i ważność testów, hooki
# on-run-start/on-run-end. dbt czyta ten plik jako pierwszy przy każdym uruchomieniu.

# Nazwa projektu dbt - powinna zawierać tylko małe litery i podkreślenia
# Powinna odzwierciedlać organizację lub przeznaczenie projektu
name: 'ecommerce_analytics'  # nie 'dbt_bigquery' - ta nazwa jest zastrzeżona przez wewnętrzny pakiet makr adaptera dbt-bigquery

# Wersja projektu - pozwala na zarządzanie wersjami konfiguracji
version: '1.0.0'

config-version: 2

# Określa, który profil dbt zostanie użyty do połączenia z bazą danych
profile: 'ecommerce_analytics'

# Ścieżki do różnych typów plików w projekcie dbt
model-paths: ["models"]         # Katalog, w którym znajdują się modele SQL
analysis-paths: ["analyses"]     # Katalog na analizy ad hoc w SQL
test-paths: ["tests"]            # Katalog na testy dbt
seed-paths: ["seeds"]            # Katalog na pliki CSV (seed data)
macro-paths: ["macros"]          # Katalog na makra dbt
snapshot-paths: ["snapshots"]    # Katalog na snapshoty historyczne

# Katalog, w którym dbt zapisuje skompilowane pliki SQL i wyniki
target-path: "target"

# Określa katalogi, które zostaną usunięte przez `dbt clean`
clean-targets:
  - "target"
  - "dbt_packages"

# Makro get_brand_name() (macros/macro_get_brand_name.sql) tworzy UDF w BigQuery na starcie każdego
# procesu dbt. Zostaje jako przykład hooka, nie wzorzec: to dodatkowy job przy KAŻDEJ komendzie
# i obiekt spoza lineage dbt. Dla jednego REGEXP_EXTRACT wystarczy makro inline (jak is_weekend);
# trwały UDF ma sens, gdy logikę wołają konsumenci SPOZA dbt (BI, konsola).
on-run-start:
  - "{{ get_brand_name() }}"  # Automatyczne uruchomienie makra na starcie

# Konfiguracja domyślnego zachowania dla modeli w projekcie
models:
  ecommerce_analytics:
    # table, nie view: przy małym datasecie demo pełny rebuild jest pomijalny, a odczyt z tabeli
    # szybszy niż z widoku. Incremental punktowo tam, gdzie tabela rośnie (stg_ecommerce__events).
    # ZAŁOŻENIE DO REWIZJI: table płaci pełny skan źródła przy KAŻDYM run, view - dopiero przy
    # odpytaniu. Przy źródle rzędu setek GB: staging jako view, table/incremental tylko dla martów.
    +materialized: table
    # Opisy z .yml trafiają jako metadane do BigQuery - widać je w konsoli i BI, nie tylko w dbt docs.
    +persist_docs:
      relation: true
      columns: true
    # Dev: tabele znikają po 1h (bez ręcznego sprzątania). Prod: none, bo expiration to zegar
    # KASUJĄCY tabelę - tydzień przerwy w harmonogramie i tabela prod znika bez żadnego błędu w dbt.
    # Default dotyczy każdego modelu; model incremental musi go nadpisać (stg_ecommerce__events),
    # inaczej w dev zawsze buduje się od zera. Jedna linia zamiast bloku |, bo tak dbt renderuje
    # wartość natywnie (int 1 / null w manifeście), a nie jako string ' 1\n'.
    +hours_to_expiration: "{{ 1 if target.name == 'dev' else none }}"

    marts:
      # Deklaracja, nie kontrola dostępu. group + access pilnują tylko, kto może ref()-ować model
      # (przy kompilacji). Kto może zbudować model - IAM konta z profiles.yml; kto czytać tabelę -
      # IAM na datasecie BigQuery; kto zmienić kod - git (.github/CODEOWNERS + branch protection).
      # +group dziedziczy PO CICHU każdy nowy model w marts/, bez żadnego przeglądu. access celowo
      # nie jest tu ustawiony: public ma być jawną decyzją per model, nie skutkiem folderu.
      +group: sales


# Konfiguracja domyślna dla testów w projekcie
tests:
  ecommerce_analytics:
    # warn: problem ma być widoczny, a pipeline ma lecieć dalej. Deklaracja, nie bramka: warn nie
    # zatrzymuje builda ani modeli zależnych (exit code 0), a "widoczny" znaczy tylko: wpis w logu.
    # Dlatego error dostaje każda kolumna, na której stoi join albo agregacja (klucze w staging,
    # department sterujący kolumnami dim_orders); warn zostaje dla reguł biznesowych. Żeby warn
    # ktoś zobaczył, potrzebny jest routing: --store-failures + alert (Slack/PagerDuty).
    +severity: warn
