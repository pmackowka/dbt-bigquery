# Generowany przez dbt deps: jedna konkretna wersja każdego pakietu (także zależności pośrednich,
# np. dbt_date), nawet gdy packages.yml dopuszcza zakres. Commitowany jak package-lock.json w npm -
# dbt deps na innej maszynie instaluje identyczne wersje.
# sha1_hash to hash listy pakietów z packages.yml (nie tekstu pliku - komentarze się nie liczą).
# dbt regeneruje ten plik tylko przy niezgodności hasha, więc ten komentarz przetrwa zwykłe dbt deps.
packages:
  - name: dbt_utils
    package: dbt-labs/dbt_utils
    version: 1.4.1
  - name: dbt_expectations
    package: metaplane/dbt_expectations
    version: 0.10.10
  - name: dbt_date
    package: godatadriven/dbt_date
    version: 0.21.0
sha1_hash: da587d6a2d8b3bd47697f80cbc79c667b023315b
