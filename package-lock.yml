# Plik generowany automatycznie przez `dbt deps` - zapisuje DOKŁADNE, przetestowane wersje
# pakietów z packages.yml (packages.yml pozwala na zakresy typu ">=0.8.0,<0.9.0", ten plik
# zawsze wskazuje jedną konkretną wersję). Commitowany celowo (jak package-lock.json w npm) -
# dzięki temu `dbt deps` na innym komputerze instaluje IDENTYCZNE wersje, a nie cokolwiek
# najnowszego, co akurat wypadło z zakresu w packages.yml.
#
# `dbt deps` NIE nadpisuje tego pliku, dopóki packages.yml się nie zmieni (sha1_hash poniżej to
# hash zawartości packages.yml - dbt porównuje go przy każdym uruchomieniu i regeneruje ten plik
# tylko przy niezgodności) - ten komentarz przetrwa zwykłe `dbt deps`, zniknie dopiero przy
# faktycznej zmianie wersji pakietu.
packages:
