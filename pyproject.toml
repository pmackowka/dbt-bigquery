# Środowisko Pythona dla dbt - JEDYNE miejsce, gdzie ręcznie wpisuje się zależności.
# Cykl: deklaracja (ten plik) -> rozwiązanie drzewa (uv lock) -> odtworzenie 1:1 (uv sync).
#
# Trzy pliki, trzy role:
#   pyproject.toml   - co wybieram świadomie (zależności bezpośrednie), pisany ręcznie
#   uv.lock          - CAŁE drzewo (dbt-core, protobuf...) z wersjami i hashami; generowany, nie edytować
#   .python-version  - wersja interpretera; uv sync pobiera go sam, jeśli brakuje w systemie
#
# Codzienne komendy:
#   uv sync                  - .venv dokładnie według uv.lock (usuwa pakiety spoza locka)
#   uv run dbt build ...     - dbt w .venv bez ręcznej aktywacji
#   uv add <pakiet>          - dopisuje zależność tutaj i przelicza uv.lock
#   uv lock --upgrade-package dbt-bigquery  - świadome podbicie wersji
#   uv sync --locked         - dla CI: pada, gdy uv.lock nie zgadza się z tym plikiem
[project]
name = "ecommerce-analytics"
version = "1.0.0"
description = "dbt Core na BigQuery - analityka e-commerce na thelook_ecommerce"
# uv.lock rozwiązuje zależności dla każdego Pythona z tego zakresu i każdego systemu naraz.
requires-python = ">=3.11"
dependencies = [
    # Tylko adapter - reszta stosu jest przypięta w uv.lock. ==, bo podbicie ma być świadomą zmianą.
    "dbt-bigquery==1.12.0",
]

[tool.uv]
# To środowisko do uruchamiania dbt, nie paczka do publikacji - uv instaluje same zależności.
package = false
